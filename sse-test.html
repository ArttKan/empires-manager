<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSE connection test</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; font-size: 1.2rem; }
    .big { font-size: 3rem; font-weight: bold; }
    .ok { color: green; }
    .bad { color: red; }
    .muted { color: #555; }
    #log { font-size: 0.9rem; color: #555; margin-top: 2rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div>Latest state version:</div>
  <div class="big" id="version">—</div>
  <div>Connection: <span id="status">connecting…</span></div>
  <div class="muted">Seconds since last change: <span id="age">—</span></div>
  <p class="muted">
    Idle gaps are normal — the stream only sends an event when the game state
    actually changes. Heartbeat comments keep the connection open in between but
    are invisible to JavaScript, so a growing counter here is not a fault.
  </p>
  <div id="log"></div>

  <script>
    const versionEl = document.getElementById('version');
    const ageEl = document.getElementById('age');
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');

    let lastChange = null;

    function log(msg) {
      const t = new Date().toLocaleTimeString();
      logEl.textContent = `[${t}] ${msg}\n` + logEl.textContent;
    }

    // Suhteellinen polku: sama sivu toimii sekä tunnelin läpi että paikallisesti.
    const es = new EventSource('/events');

    es.addEventListener('state', (e) => {
      let version = '—';
      try {
        version = JSON.parse(e.data).state_version ?? 'no game';
      } catch (err) {
        version = '(unparseable)';
      }
      versionEl.textContent = version;
      lastChange = Date.now();
      log('state version -> ' + version);
    });

    es.onopen = () => {
      statusEl.textContent = 'open';
      statusEl.className = 'ok';
      log('connection opened');
    };
    es.onerror = () => {
      statusEl.textContent = 'dropped, readyState=' + es.readyState;
      statusEl.className = 'bad';
      log('error / connection dropped, readyState=' + es.readyState);
    };

    setInterval(() => {
      if (lastChange === null) return;
      ageEl.textContent = Math.round((Date.now() - lastChange) / 1000);
    }, 1000);
  </script>
</body>
</html>
