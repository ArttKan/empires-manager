<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101722">
<title>Mega Empires</title>
<style>
  :root {
    --bg: #101722; --panel: #182231; --panel-alt: #223044;
    --text: #f5f7fa; --muted: #aeb9c7; --accent: #d6a642; --error: #b94141;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
  }
  #scroll {
    flex: 1; min-height: 0; overflow-y: auto; position: relative;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  }
  /* Pull down from the top to refresh. The browser's own gesture does not
     work, because the scrolling element is this container, not the document. */
  #pull {
    position: absolute; top: 0; left: 0; right: 0; z-index: 4;
    display: flex; align-items: center; justify-content: center;
    height: 0; overflow: hidden;
    color: var(--muted); font-size: .85rem;
    transition: height .18s ease;
  }
  #pull.armed { color: var(--accent); }
  #pull.busy { height: 38px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 24px; }
  h1 { font-size: 1.4rem; margin: 8px 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; font-size: .95rem; }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
  input[type=text] {
    width: 100%; padding: 16px; font-size: 1.6rem; text-align: center;
    letter-spacing: .25em; text-transform: uppercase;
    background: var(--panel-alt); color: var(--text);
    border: 1px solid #344258; border-radius: 10px;
  }
  button {
    width: 100%; padding: 16px; font-size: 1.05rem; font-weight: 600;
    border: 0; border-radius: 10px; margin-top: 14px;
    background: var(--accent); color: #101010;
  }
  button.secondary { background: var(--panel-alt); color: var(--text); }
  button:disabled { opacity: .5; }
  .seat {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; padding: 16px; margin-bottom: 8px;
    background: var(--panel); color: var(--text);
    border: 1px solid #344258; border-radius: 10px;
    font-size: 1.1rem; text-align: left;
  }
  .seat:disabled { opacity: .45; }
  .seat .taken { font-size: .8rem; color: var(--muted); }
  .swatch { width: 14px; height: 34px; border-radius: 4px; margin-right: 12px; }
  .seat span.name { display: flex; align-items: center; }
  .msg { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: .95rem; }
  .msg.error { background: #3a1f1f; color: #ffc9c9; }
  .msg.info { background: var(--panel); color: var(--muted); }
  /* !important, because this is a utility class whose whole job is to hide.
     Without it any id rule that sets display wins on specificity and the
     element stays visible forever — which is exactly what happened to #other,
     which is `display: flex`. An unpleasant fault to find: the class toggles
     correctly in the DOM and nothing happens. */
  .hidden { display: none !important; }

  /* ── oma rivi ─────────────────────────────────────────────── */
  /* The colour from the component. Used as a border rather than a text
     colour, because some civilizations are very light (Iberia, Egypt) and
     others dark (Kushan, Parthia) — neither reads reliably as text. */
  .me {
    background: var(--panel); border-radius: 12px; padding: 18px;
    margin-bottom: 16px; border-left: 8px solid transparent;
  }
  .me .civ { font-size: 2rem; font-weight: 700; line-height: 1.1; }
  .me .who { color: var(--muted); font-size: .95rem; margin-top: 2px; }
  .me .score { display: flex; align-items: baseline; gap: 10px; margin-top: 12px; }
  .me .rank {
    font-size: 2.4rem; font-weight: 700; color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .me .total { font-size: 2.4rem; font-weight: 700; color: var(--accent); }
  .me .parts { color: var(--muted); font-size: .85rem; }
  .control { background: var(--panel); border-radius: 12px; padding: 14px 18px; margin-bottom: 12px; }
  .control .label { color: var(--muted); font-size: .85rem; margin-bottom: 10px; }
  .stepper { display: flex; align-items: center; gap: 14px; }
  .stepper button {
    width: 68px; height: 68px; margin: 0; font-size: 2rem; font-weight: 700;
    background: var(--panel-alt); color: var(--text); border-radius: 14px;
  }
  .stepper button:active { background: #31445f; }
  .stepper button:disabled { opacity: .3; background: var(--panel); }
  .stepper .value { flex: 1; text-align: center; font-size: 2.2rem; font-weight: 700; }
  .control.locked { opacity: .55; }
  .control.locked input, .control.locked button { pointer-events: none; }
  .control input[type=number] {
    width: 100%; padding: 14px; font-size: 2rem; text-align: center;
    background: var(--panel-alt); color: var(--text);
    border: 1px solid #344258; border-radius: 12px;
  }
  .standings { background: var(--panel); border-radius: 12px; padding: 8px 4px; margin: 20px 0 12px; }
  .standings .row {
    display: grid; grid-template-columns: 34px 1fr auto;
    align-items: center; padding: 9px 14px; font-size: .95rem;
  }
  .standings .row.self { background: var(--panel-alt); border-radius: 8px; font-weight: 600; }
  .standings .rank { color: var(--muted); }
  .standings .pts { color: var(--accent); font-weight: 600; }
  .bar {
    position: sticky; top: 0; z-index: 5; margin: -20px -16px 14px;
    padding: 7px 16px; font-size: .8rem; text-align: center;
    background: var(--panel-alt); color: var(--muted);
  }
  .bar.warn { background: #4a3a1c; color: #ffe0a3; }
  /* Editing someone else's row is this program's worst source of error, so it
     stands out the most strongly: the whole bar changes colour, not just the
     heading text. */
  #other {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 12px; padding: 12px 14px; border-radius: 10px;
    background: #5a2d12; color: #ffd8bd; font-size: .95rem; font-weight: 600;
  }
  #other button { width: auto; margin: 0; padding: 8px 14px; font-size: .85rem; }
  /* Which code was accepted. Without this you would only see it after
     claiming a seat. */
  #seat-role {
    margin-bottom: 14px; padding: 10px 12px; border-radius: 8px;
    background: #5a2d12; color: #ffd8bd; font-size: .9rem; font-weight: 600;
  }
  .tabs button.elsewhere { color: #ffb98a; }
  .standings .row.pick { cursor: pointer; }
  .standings .row.pick:active { background: var(--panel-alt); }
  .bar.bad { background: #3a1f1f; color: #ffc9c9; }

  /* ── Civilization Advances ────────────────────────────────── */
  .credits { display: flex; gap: 6px; margin-bottom: 14px; }
  .credits div {
    flex: 1; text-align: center; padding: 8px 2px; border-radius: 8px;
    font-size: .75rem; font-weight: 700; color: #101010;
  }
  .card {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 12px 14px; margin-bottom: 6px; text-align: left;
    background: var(--panel); color: var(--text);
    border: 1px solid #344258; border-radius: 10px;
    /* The stripe is an element of its own rather than a border, because a
       two-colour card has to show both of its colours — a border can carry
       only one. */
    overflow: hidden;
  }
  .card .band {
    flex: none; align-self: stretch; width: 6px;
    /* Negatiivinen marginaali vie raidan kortin reunaan kiinni paddingin ohi. */
    margin: -12px 4px -12px -14px;
  }
  .card.owned { border-color: var(--accent); background: var(--panel-alt); }
  .card:disabled { opacity: 1; }   /* view mode: cards render normally */
  .card.locked .tick { color: var(--muted); }
  .card .tick { width: 22px; font-size: 1.1rem; color: var(--accent); }
  .card .body { flex: 1; min-width: 0; }
  .card .nm { font-size: 1rem; }
  /* VP is a column of its own rather than part of a subtitle: it is the
     card's fixed worth, while the price moves with the credits. Two different
     numbers must not occupy the same slot in turn — that is exactly what
     produced the earlier confusion where "7 advances" read points, not cards. */
  .card .vp {
    flex: none; width: 42px; text-align: center;
    font-variant-numeric: tabular-nums; line-height: 1.05;
  }
  .card .vp b { font-size: 1.05rem; font-weight: 700; }
  .card .vp i {
    display: block; font-style: normal; font-size: .62rem;
    color: var(--muted); letter-spacing: .08em;
  }
  .card .price {
    text-align: right; font-variant-numeric: tabular-nums;
    /* A fixed width for three digits. Without it the column shrinks on a
       two-digit price — and disappears entirely on an already-bought card,
       which has no price — so the flexible name column widens and the VP
       column shifts from row to row. The dearest card is 290, so three is
       enough. */
    flex: none; min-width: 36px;
  }
  .card .price .now { font-size: 1.05rem; font-weight: 700; }
  .card .price .was { color: var(--muted); font-size: .75rem; text-decoration: line-through; }
  .cards-head {
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; margin-bottom: 12px;
  }
  .cards-head button { width: auto; margin: 0; padding: 12px 18px; }
  /* -- tabs -------------------------------------------------- */
  /* The bar belongs to the app shell, not to the scrolling content: it does
     not move, so overscrolling reveals nothing beneath it and it need not be
     repainted during a scroll. */
  .tabs {
    flex: none; display: flex;
    background: var(--panel); border-top: 1px solid #344258;
  }
  .tabs button {
    flex: 1; margin: 0; border-radius: 0;
    /* No env(safe-area-*) padding: without viewport-fit=cover the browser
       already crops the viewport above the system bars, so reserving space
       ourselves would show as an empty band below the buttons. */
    padding: 14px 8px;
    background: transparent; color: var(--muted);
    font-size: .95rem; font-weight: 600;
  }
  .tabs button.active { color: var(--accent); box-shadow: inset 0 2px 0 var(--accent); }

  /* ── pistetaulu ───────────────────────────────────────────── */
  .board { background: var(--panel); border-radius: 12px; padding: 6px 0; }
  .board .dot {
    width: 10px; height: 10px; border-radius: 50%;
    display: inline-block; margin-right: 7px; vertical-align: baseline;
  }
  .board .row {
    display: grid;
    grid-template-columns: 30px minmax(0, 1fr) 38px 44px 46px;
    align-items: center; gap: 4px; padding: 10px 12px;
    font-size: .95rem; font-variant-numeric: tabular-nums;
  }
  .board .row.head {
    padding: 6px 12px; font-size: .7rem; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted); border-bottom: 1px solid #344258;
  }
  .board .row.self { background: var(--panel-alt); font-weight: 600; }
  .board .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board .rank { color: var(--muted); }
  .board .num { text-align: right; color: var(--muted); }
  .board .pts { text-align: right; color: var(--accent); font-weight: 700; }

  .sticky-save {
    position: sticky; bottom: 0; margin: 0 -16px; padding: 12px 16px;
    background: linear-gradient(transparent, var(--bg) 22%);
  }
</style>
</head>
<body>
<div id="scroll">
<div id="pull"></div>
<div class="wrap">

  <!-- ── liittyminen ───────────────────────────────────────────── -->
  <section id="join-code">
    <h1>Mega Empires</h1>
    <p class="sub">Enter the game code.</p>
    <label for="code">Game code</label>
    <input id="code" type="text" inputmode="latin" autocomplete="off"
           autocapitalize="characters" maxlength="8" placeholder="ABCDE">
    <button id="code-go">Continue</button>
    <div id="code-msg" class="msg hidden"></div>
  </section>

  <!-- ── paikan valinta ───────────────────────────────────────── -->
  <section id="join-seat" class="hidden">
    <h1>Pick your civilization</h1>
    <div id="seat-role" class="hidden"></div>
    <div id="seats"></div>
    <button id="seat-back" class="secondary">Back</button>
    <div id="seat-msg" class="msg hidden"></div>
  </section>

  <!-- -- the game view ---------------------------------------- -->
  <section id="play" class="hidden">
    <div class="bar" id="bar">Connecting…</div>

    <div id="other" class="hidden">
      <span id="other-text"></span>
      <button id="other-back" class="secondary">My row</button>
    </div>

    <div class="me">
      <div class="civ" id="play-civ">—</div>
      <div class="who" id="play-who"></div>
      <div class="score">
        <span class="rank" id="play-rank">—</span>
        <span class="total" id="play-total">0</span>
        <span class="parts" id="play-parts"></span>
      </div>
    </div>

    <div class="control">
      <div class="label">Cities</div>
      <div class="stepper">
        <button id="cities-down" aria-label="One city fewer">−</button>
        <div class="value" id="cities-value">0</div>
        <button id="cities-up" aria-label="One city more">+</button>
      </div>
    </div>

    <div class="control" id="census-box">
      <div class="label" id="census-label">Census — population tokens on the board</div>
      <input id="census" type="number" inputmode="numeric" min="0" max="55">
    </div>

    <div class="control" id="cards-box">
      <div class="label">Civilization Advances</div>
      <div id="cards-summary" class="stepper" style="font-size:1.1rem">—</div>
      <button id="cards-open" class="secondary" style="margin-top:12px">Buy Advances</button>
    </div>

    <div id="play-msg" class="msg hidden"></div>
  </section>

  <!-- ── pistetaulu ───────────────────────────────────────────── -->
  <section id="board" class="hidden">
    <div class="bar" id="board-bar">—</div>
    <div class="board" id="board-list"></div>
  </section>

  <!-- ── Civilization Advances ────────────────────────────────── -->
  <section id="cards" class="hidden">
    <div class="cards-head">
      <div>
        <h1 style="margin:0">Advances</h1>
        <p class="sub" style="margin:2px 0 0" id="cards-sub"></p>
      </div>
      <button id="cards-cancel" class="secondary">Cancel</button>
    </div>
    <div class="credits" id="cards-credits"></div>
    <div id="cards-list"></div>
    <div id="cards-note" class="msg info hidden">
      Advances are bought in phase 12. You can look at the list and the prices
      now, but not change it.
    </div>
    <div class="sticky-save">
      <button id="cards-save">Save</button>
    </div>
    <div id="cards-msg" class="msg hidden"></div>
  </section>

</div>
</div>

  <nav class="tabs hidden" id="tabs">
    <button id="tab-me" class="active">—</button>
    <button id="tab-board">Scoreboard</button>
  </nav>

<script>
const STORE_KEY = "megaempires.session";
// One message for every entry failure: from the player's point of view the
// cause is the same — the value did not get through, look at the numbers on
// screen and try again if needed. The mechanics of a conflict do not help
// them at the table.
const ENTRY_FAILED =
  "Entering the information failed. Check the shown values and try again " +
  "if necessary.";

const el = (id) => document.getElementById(id);
const TABBED = ["play", "board"];   // views that show the tab bar

// Which section is visible. The back handler has to know: it may close only
// the Advances sheet, never take the player off the page from anywhere else.
let view = "join-code";

const show = (id) => {
  view = id;
  for (const s of ["join-code", "join-seat", "play", "board", "cards"]) {
    el(s).classList.toggle("hidden", s !== id);
  }
  // The bar is hidden during joining and the Advances sheet: switching tabs
  // mid-purchase would lose the selections.
  const tabbed = TABBED.includes(id);
  el("tabs").classList.toggle("hidden", !tabbed);
  if (tabbed) {
    el("tab-me").classList.toggle("active", id === "play");
    el("tab-board").classList.toggle("active", id === "board");
  }
};
const message = (id, text, kind) => {
  const node = el(id);
  node.textContent = text;
  node.className = "msg " + (kind || "info");
  node.classList.toggle("hidden", !text);
};

// localStorage can throw in a private window or when cookies are blocked.
const session = {
  read() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY) || "null"); }
    catch (e) { return null; }
  },
  write(value) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(value)); }
    catch (e) { /* the session then lives only for this tab */ }
  },
  clear() {
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  },
};

async function api(path, options) {
  const response = await fetch(path, options);
  let body = null;
  try { body = await response.json(); } catch (e) {}
  return { ok: response.ok, status: response.status, body };
}

let joinCode = "";

async function submitCode() {
  const code = el("code").value.trim().toUpperCase();
  if (!code) return;
  el("code-go").disabled = true;
  message("code-msg", "Checking…", "info");
  const { ok, status, body } = await api("/join/roster", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code }),
  });
  el("code-go").disabled = false;
  if (!ok) {
    // The page explains in its own words: it knows which seat was tapped,
    // which the server's generic error message cannot reach.
    const texts = {
      403: "That code did not work. Check it on the TV.",
      429: "Too many attempts. Wait a few minutes.",
      503: "The server has no game running.",
    };
    message("code-msg", texts[status] || "Could not reach the server.", "error");
    return;
  }
  message("code-msg", "", "info");
  joinCode = code;
  // The server says which code it recognised; there is only one field.
  const role = el("seat-role");
  role.classList.toggle("hidden", !body.elevated);
  if (body.elevated) {
    role.textContent =
      "Admin code accepted — you will be able to edit every player's row.";
  }
  renderSeats(body.players);
  show("join-seat");
}

function renderSeats(players) {
  const box = el("seats");
  box.innerHTML = "";
  for (const player of players) {
    const button = document.createElement("button");
    button.className = "seat";
    button.disabled = player.claimed;
    button.innerHTML =
      `<span class="name">` +
        `<span class="swatch" style="background:${player.color}"></span>` +
        `${player.civilization}` +
        `${player.nickname ? " (" + player.nickname + ")" : ""}</span>` +
      (player.claimed ? `<span class="taken">claimed</span>` : "");
    button.onclick = () => claim(player.civilization);
    box.appendChild(button);
  }
}

async function claim(civilization) {
  message("seat-msg", "Joining…", "info");
  const { ok, status, body } = await api("/join", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code: joinCode, civilization }),
  });
  if (!ok) {
    const texts = {
      403: "The code is no longer valid. Go back and enter it again.",
      409: `${civilization} was just taken. Ask the game master to free it.`,
      429: "Too many attempts. Wait a few minutes.",
    };
    message("seat-msg", texts[status] || "Could not join.", "error");
    // Show the fresh situation: someone else got in first.
    const refreshed = await api("/join/roster", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: joinCode }),
    });
    if (refreshed.ok) renderSeats(refreshed.body.players);
    return;
  }
  session.write({ token: body.token, civilization: body.civilization });
  elevated = !!body.elevated;
  message("seat-msg", "", "info");
  enterGame();
}

// -- the game view --------------------------------------------
const CENSUS_DEBOUNCE_MS = 400;
// Rapid successive taps used to send a second command before the first
// response arrived, so the version was stale and the user got a pointless
// conflict warning. Now the taps are collected into one command.
const CITIES_DEBOUNCE_MS = 500;
const MAX_CITIES = 9;
const POLL_FALLBACK_MS = 15000;

let me = null;          // the row being shown, from the latest snapshot
// An elevated phone views and edits other rows too, so "whose row is showing"
// is a different thing from "which seat did I claim".
let viewing = null;
let elevated = false;
let game = null;        // koko tilannekuva
let censusTimer = null;
let citiesTimer = null;
let citiesPending = null;   // the displayed value before the command has gone
let events = null;

function authHeaders() {
  const saved = session.read();
  return saved ? { Authorization: "Bearer " + saved.token } : {};
}

function bar(text, kind) {
  const node = el("bar");
  node.textContent = text;
  node.className = "bar" + (kind ? " " + kind : "");
}

async function refresh() {
  const saved = session.read();
  if (!saved) return;
  const { ok, status, body } = await api("/state", { headers: authHeaders() });
  if (status === 401) {
    // The token is no longer valid — most often a new game has been started.
    session.clear();
    if (events) { events.close(); events = null; }
    message("code-msg", "This game has ended. Ask for the new code.", "info");
    show("join-code");
    return;
  }
  if (!ok) {
    bar(status === 503 ? "No game on the server" : "Reconnecting…", "warn");
    return;
  }
  game = body;
  // Elevation is always read from the server. A stale value left in
  // localStorage would still show the editing controls after a seat's release.
  elevated = !!(body.you && body.you.elevated);
  if (!viewing) viewing = saved.civilization;
  if (!elevated && viewing !== saved.civilization) setViewing(saved.civilization);
  me = body.players.find((p) => p.civilization === viewing) || null;
  if (!me && viewing !== saved.civilization) {
    // The viewed row is gone — return to your own rather than sit on nothing.
    setViewing(saved.civilization);
    me = body.players.find((p) => p.civilization === viewing) || null;
  }
  if (!me) {
    bar(saved.civilization + " is not in this game", "bad");
    return;
  }
  bar("Turn " + body.round_number + " · Phase " + body.current_phase);
  render();
}

function setViewing(civilization) {
  if (viewing === civilization) return;
  viewing = civilization;
  // Any pending input is already bound to its own row (see changeCities and
  // scheduleCensus), so the timers need not be cancelled — they land right.
  // The displayed value, on the other hand, belongs to the previous row.
  citiesPending = null;
  el("census").blur();
  message("play-msg", "", "info");
}

function render() {
  el("play-civ").textContent = me.civilization;
  // Writing to the wrong player's row is this program's worst error, and an
  // elevated phone makes it possible — hence the banner is loud and stays
  // visible the whole time, not just at the moment of switching.
  const own = (session.read() || {}).civilization;
  const elsewhere = elevated && me.civilization !== own;
  el("other").classList.toggle("hidden", !elsewhere);
  if (elsewhere) {
    el("other-text").textContent = "Editing " + me.civilization + " — not your row";
  }
  document.querySelector("#play .me").style.borderLeftColor = me.color;
  el("play-who").textContent = me.nickname
    ? me.nickname + " · " + me.block
    : me.block;
  el("tab-me").textContent = me.civilization;
  el("tab-me").classList.toggle("elsewhere", elsewhere);
  el("play-rank").textContent = me.rank + ".";
  el("play-total").textContent = me.score.total;
  // "7 advances" used to read points, not cards. The breakdown now gives
  // each number separately, so they cannot be confused.
  el("play-parts").textContent =
    me.score.cities + " from cities + " +
    me.score.ast + " from A.S.T. + " +
    me.score.advances + " points from " + me.advances.length + " advances" +
    (me.score.bonus ? " + " + me.score.bonus + " bonus" : "");
  renderCities();

  // Do not write over the field while it is being typed into.
  const census = el("census");
  if (document.activeElement !== census && censusTimer === null) {
    census.value = me.census;
  }

  // The phase gates come from the server, so the rule is not repeated here.
  const gates = game.phase_gates || {};
  const inPhase = (command) =>
    !gates[command] || gates[command].includes(game.current_phase);
  // An elevated phone bypasses the gates on the server, so the view must open
  // them too — otherwise the UI would forbid what the server would accept.
  const gateOpen = (command) => elevated || inPhase(command);
  // ...but still say when a gate has been bypassed: the game master must not
  // record Census in the wrong phase without noticing.
  const bypassing = (command) => elevated && !inPhase(command);
  const phaseList = (command) => (gates[command] || []).join(" and ");

  const censusOpen = gateOpen("census");
  el("census-box").classList.toggle("locked", !censusOpen);
  census.disabled = !censusOpen;
  el("census-label").textContent = !censusOpen
    ? "Census — counted in phase " + phaseList("census") +
      " (now phase " + game.current_phase + ")"
    : bypassing("census")
      ? "Census — outside phase " + phaseList("census") + ", editing as admin"
      : "Census — population tokens on the board";

  // The list always opens: looking at your own cards is not editing, and a
  // player needs to see what they hold in any phase.
  const canBuy = gateOpen("advances");
  el("cards-open").textContent = !canBuy
    ? "View new test Advances"
    : bypassing("advances") ? "Edit Advances" : "Buy Advances";
  // The gold highlight only when buying is genuinely possible; otherwise
  // muted, so the button does not tempt in a phase where it is no use.
  el("cards-open").classList.toggle("secondary", !canBuy);
  renderAdvanceSummary();
  renderBoard();
}

function renderBoard() {
  if (!game) return;
  el("board-bar").textContent =
    "Turn " + game.round_number + " · Phase " + game.current_phase;

  const box = el("board-list");
  const ordered = [...game.players].sort(
    (a, b) => b.score.total - a.score.total || a.rank - b.rank
  );
  box.innerHTML =
    '<div class="row head">' +
      "<span></span><span>Civilization</span>" +
      '<span class="num">City</span><span class="num">Cens</span>' +
      '<span class="pts">VP</span>' +
    "</div>";
  for (const player of ordered) {
    const row = document.createElement("div");
    row.className =
      "row" + (me && player.civilization === me.civilization ? " self" : "") +
      (elevated ? " pick" : "");
    if (elevated) {
      // A tappable scoreboard is the most natural picker: the game master
      // sees the row they are helping and touches exactly that. A separate
      // pudotusvalikko vaatisi nimen tunnistamisen listasta uudestaan.
      row.onclick = () => {
        setViewing(player.civilization);
        // The row is already in this snapshot, so draw at once rather than
        // odottamaan verkkoa — muuten edellisen rivin luvut vilahtaisivat.
        me = player;
        render();
        show("play");
        refresh();
      };
    }
    row.innerHTML =
      `<span class="rank">${player.rank}.</span>` +
      `<span class="nm">` +
        `<span class="dot" style="background:${player.color}"></span>` +
        `${player.civilization}` +
        `${player.nickname ? " (" + player.nickname + ")" : ""}</span>` +
      `<span class="num">${player.cities}</span>` +
      `<span class="num">${player.census}</span>` +
      `<span class="pts">${player.score.total}</span>`;
    box.appendChild(row);
  }
}

async function command(route, payload, civilization) {
  // The row is bound in the call rather than read from `me`: a delayed command
  // belongs to the row that was tapped, not to whichever happens to be showing
  // when the delay expires.
  const civ = civilization || viewing;
  const row = game ? game.players.find((p) => p.civilization === civ) : null;
  if (!row) return;
  const { ok, status, body } = await api(
    "/players/" + encodeURIComponent(civ) + "/" + route,
    {
      method: "POST",
      headers: { "Content-Type": "application/json", ...authHeaders() },
      // expected_version stops a slow tap from overwriting a correction just
      // kannettavalta juuri tehdyn korjauksen.
      body: JSON.stringify({ ...payload, expected_version: row.version, actor: "phone" }),
    }
  );
  if (ok) {
    message("play-msg", "", "info");
    await refresh();
    return;
  }
  if (status === 409) {
    message("play-msg", ENTRY_FAILED, "error");
    await refresh();
    return;
  }
  if (status === 401) { await refresh(); return; }
  const texts = {
    403: "You cannot change that.",
    422: "The phase changed — that can only be entered in its own phase.",
  };
  message("play-msg", texts[status] || ENTRY_FAILED, "error");
}

function citiesShown() {
  return citiesPending !== null ? citiesPending : (me ? me.cities : 0);
}

function renderCities() {
  const value = citiesShown();
  el("cities-value").textContent = value;
  el("cities-down").disabled = value <= 0;
  el("cities-up").disabled = value >= MAX_CITIES;
}

function changeCities(delta) {
  if (!me) return;
  const target = Math.max(0, Math.min(MAX_CITIES, citiesShown() + delta));
  if (target === citiesShown()) return;
  citiesPending = target;
  renderCities();                       // immediate feedback for the tap
  const civilization = viewing;
  const before = me.cities;
  if (citiesTimer !== null) clearTimeout(citiesTimer);
  citiesTimer = setTimeout(() => {
    citiesTimer = null;
    const value = citiesPending;
    citiesPending = null;
    if (value === null || value === before) { renderCities(); return; }
    command("cities", { value }, civilization);
  }, CITIES_DEBOUNCE_MS);
}

function scheduleCensus() {
  // The row and the text are read here. Every keystroke reschedules, so the
  // latest text wins — and the value stays bound to the row it was typed for,
  // even if the view changes in the meantime.
  const civilization = viewing;
  const raw = el("census").value.trim();
  const before = me ? me.census : null;
  if (censusTimer !== null) clearTimeout(censusTimer);
  censusTimer = setTimeout(() => {
    censusTimer = null;
    if (raw === "") return;
    const value = Math.max(0, Math.min(55, parseInt(raw, 10) || 0));
    if (value === before) return;
    command("census", { value }, civilization);
  }, CENSUS_DEBOUNCE_MS);
}

function listen() {
  // The stream only says something changed; the state itself is fetched with
  // the token.
  if (events) events.close();
  events = new EventSource("/events");
  events.addEventListener("state", () => refresh());
  events.onopen = () => refresh();
  events.onerror = () => bar("Reconnecting…", "warn");
  // A phone drops the stream when the screen locks; the fallback poll makes
  // sure the view is fresh even if the connection does not come back by itself.
  setInterval(() => { if (document.visibilityState === "visible") refresh(); },
              POLL_FALLBACK_MS);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") refresh();
  });
}

function enterGame() {
  const saved = session.read();
  if (!saved) { show("join-code"); return; }
  viewing = saved.civilization;
  el("play-civ").textContent = saved.civilization;
  el("tab-me").textContent = saved.civilization;
  show("play");
  refresh();
  listen();
}

// ── Civilization Advances ─────────────────────────────────────
// The card colours match the desktop app's group colours, so the same card
// looks the same on either screen.
const GROUP_COLORS = {
  ART: "#4471c4", CIVIC: "#d74343", CRAFT: "#ec7c30",
  RELIGION: "#d8bd27", SCIENCE: "#6fac46",
};
const GROUP_LABELS = {
  ART: "Arts", CIVIC: "Civics", CRAFT: "Crafts",
  RELIGION: "Religions", SCIENCE: "Sciences",
};

let catalogue = null;
let ordered = [];   // display order: fixed when the sheet opens
let selection = null;   // muokattava valinta; tallennetaan vasta Savella

async function openAdvances() {
  message("cards-msg", "", "info");
  const { ok, body } = await api(
    "/players/" + encodeURIComponent(viewing) + "/advances",
    { headers: authHeaders() }
  );
  if (!ok) {
    message("play-msg", "Could not load the Advances list.", "error");
    return;
  }
  catalogue = body;
  selection = new Set(body.advances.filter((a) => a.owned).map((a) => a.id));
  // The order is computed once on opening, not on every tap: otherwise a card
  // would jump to the top of the list just as it is touched and the next one
  // napautettava siirtyisi sormen alta.
  //
  // Three groups: bought on earlier turns, bought this turn, and not yet
  // bought. Separating the two bought groups is the entire reason to reopen
  // the sheet mid-phase — otherwise what was just bought vanishes among the
  // old ones and the player cannot see what they took this turn.
  //
  // The order is computed only on opening. If a group changed on a tap, the
  // card would jump up the list and the next one would move out from under
  // the thumb — the very error this whole program tries to prevent.
  const group = (a) => (!a.owned ? 2 : a.this_turn ? 1 : 0);
  // Within a group the VP band 1 -> 3 -> 6, because that is what a player
  // weighs up. `sort` is stable, so the sheet's order survives inside it.
  ordered = [...body.advances].sort(
    (a, b) => group(a) - group(b) || a.vp - b.vp
  );
  renderAdvances();
  // The sheet is a view of its own to the player, so the device's back
  // gesture may close it rather than leave the page. The entry is consumed on
  // every exit, otherwise the stack would grow with each opening.
  history.pushState({ view: "cards" }, "");
  show("cards");
  window.scrollTo(0, 0);
}

function renderCredits() {
  const box = el("cards-credits");
  box.innerHTML = "";
  for (const group of ["ART", "CIVIC", "CRAFT", "RELIGION", "SCIENCE"]) {
    const cell = document.createElement("div");
    cell.style.background = GROUP_COLORS[group];
    cell.textContent = catalogue.credits[group];
    cell.title = GROUP_LABELS[group];
    box.appendChild(cell);
  }
}

function advancesEditable() {
  // The same exception as in the main view: an elevated phone may fix cards
  // outside the phase too, because the server accepts it.
  if (elevated) return true;
  const phases = (game && game.phase_gates && game.phase_gates.advances) || [];
  return !game || phases.length === 0 || phases.includes(game.current_phase);
}

function renderAdvances() {
  renderCredits();
  const editable = advancesEditable();
  // What is owned, not what is in the basket: the selection only takes effect
  // on save, so counting a pending purchase would claim points not yet held.
  const held = catalogue.advances.filter((a) => a.owned);
  const points = held.reduce((sum, a) => sum + a.vp, 0);
  el("cards-sub").textContent =
    held.length + " owned · " + points + " VP" +
    (editable ? "" : " · view only");

  // The price counts only cards not yet owned: what is already bought is not
  // paid for again.
  const buying = catalogue.advances.filter(
    (a) => selection.has(a.id) && !a.owned
  );
  const total = buying.reduce((sum, a) => sum + a.effective_cost, 0);
  el("cards-save").textContent =
    buying.length === 0 ? "Save" : `Buy ${buying.length} for ${total}`;
  el("cards-save").classList.toggle("hidden", !editable);
  el("cards-note").classList.toggle("hidden", editable);
  el("cards-cancel").textContent = editable ? "Cancel" : "Back";

  const list = el("cards-list");
  list.innerHTML = "";
  for (const advance of ordered) {
    const chosen = selection.has(advance.id);
    const button = document.createElement("button");
    button.className =
      "card" + (chosen ? " owned" : "") + (advance.locked ? " locked" : "");
    // A two-colour card gets both of its colours: the discount comes from
    // either pool (the larger one), so showing one colour would tell half the
    // card's story.
    const bands = advance.groups.map((g) => GROUP_COLORS[g]);
    const band = bands.length === 1
      ? bands[0]
      : "linear-gradient(to bottom, " +
        bands.map((c, i) => {
          const from = (i * 100) / bands.length;
          const to = ((i + 1) * 100) / bands.length;
          return `${c} ${from}% ${to}%`;
        }).join(", ") + ")";

    // The price is hidden only on an already-owned card: it has been paid. A
    // card selected for purchase still shows its price — that is exactly what
    // the player is about to pay, and it must not be replaced by a VP value.
    const discounted = advance.effective_cost < advance.cost;
    const price = advance.owned
      ? `<div class="price"></div>`
      : `<div class="price">` +
        (discounted ? `<div class="was">${advance.cost}</div>` : "") +
        `<div class="now">${advance.effective_cost}</div></div>`;

    // A locked card is always selected too, so the mark is the same ✓. The
    // difference is the colour — `.card.locked .tick` mutes it — and that an
    // already-bought card shows no price. No emoji is used: it was the only
    // one in the whole list and renders at a different size on every device.
    button.innerHTML =
      `<span class="band" style="background:${band}"></span>` +
      `<span class="tick">${chosen ? "✓" : ""}</span>` +
      `<span class="body"><div class="nm">${advance.name}</div></span>` +
      `<div class="vp"><b>${advance.vp}</b><i>VP</i></div>` + price;
    // Cards from earlier turns are already bought: they cannot be undone.
    button.disabled = !editable || advance.locked;
    if (editable && !advance.locked) {
      button.onclick = () => {
        if (selection.has(advance.id)) selection.delete(advance.id);
        else selection.add(advance.id);
        renderAdvances();
      };
    }
    list.appendChild(button);
  }
}

async function saveAdvances() {
  el("cards-save").disabled = true;
  message("cards-msg", "Saving…", "info");
  const { ok, status } = await api(
    "/players/" + encodeURIComponent(viewing) + "/advances",
    {
      method: "POST",
      headers: { "Content-Type": "application/json", ...authHeaders() },
      body: JSON.stringify({
        advances: [...selection],
        expected_version: me ? me.version : null,
        actor: "phone",
      }),
    }
  );
  el("cards-save").disabled = false;
  if (ok) {
    await refresh();
    closeCards();
    return;
  }
  if (status === 409) {
    message("cards-msg", ENTRY_FAILED, "error");
    await refresh();
    await openAdvances();
    return;
  }
  message("cards-msg", ENTRY_FAILED, "error");
}

function renderAdvanceSummary() {
  if (!me) return;
  const count = me.advances.length;
  el("cards-summary").textContent =
    count + (count === 1 ? " card · " : " cards · ") + me.score.advances + " VP";
}

// -- pull to refresh ------------------------------------------
const PULL_THRESHOLD = 70;   // px ennen kuin ele laukeaa
let pullStart = null;
let pulled = 0;
let pullBusy = false;

function pullIndicator(height, armed, text) {
  const node = el("pull");
  node.style.height = height + "px";
  node.textContent = text;
  node.classList.toggle("armed", armed);
}

function pullReset() {
  pullStart = null;
  pulled = 0;
  el("pull").classList.remove("busy");
  pullIndicator(0, false, "");
}

const scroller = el("scroll");

scroller.addEventListener("touchstart", (event) => {
  if (pullBusy || scroller.scrollTop > 0) { pullStart = null; return; }
  pullStart = event.touches[0].clientY;
  pulled = 0;
}, { passive: true });

scroller.addEventListener("touchmove", (event) => {
  if (pullStart === null) return;
  const delta = event.touches[0].clientY - pullStart;
  // The finger moved up or the list scrolled: the gesture is no longer a pull.
  if (delta <= 0 || scroller.scrollTop > 0) { pullReset(); return; }
  // Damping, so the pull feels rubbery rather than tracking the finger 1:1.
  pulled = Math.min(delta * 0.5, PULL_THRESHOLD + 20);
  pullIndicator(
    pulled,
    pulled >= PULL_THRESHOLD,
    pulled >= PULL_THRESHOLD ? "Release to refresh" : "Pull to refresh"
  );
}, { passive: true });

scroller.addEventListener("touchend", async () => {
  if (pullStart === null) return;
  const trigger = pulled >= PULL_THRESHOLD;
  pullStart = null;
  if (!trigger) { pullReset(); return; }
  pullBusy = true;
  el("pull").classList.add("busy");
  pullIndicator(38, false, "Refreshing…");
  try {
    await refresh();
  } finally {
    pullBusy = false;
    pullReset();
  }
});

el("tab-me").onclick = () => show("play");
el("other-back").onclick = () => {
  const saved = session.read();
  if (!saved) return;
  setViewing(saved.civilization);
  const own = game
    ? game.players.find((p) => p.civilization === saved.civilization)
    : null;
  if (own) { me = own; render(); }
  show("play");
  refresh();
};
el("tab-board").onclick = () => { renderBoard(); show("board"); };

el("cards-open").onclick = openAdvances;
el("cards-cancel").onclick = () => { closeCards(); };

function closeCards() {
  // back() fires popstate, which does the actual view change — one route out
  // whether the user pressed Cancel or the device's back button.
  //
  if (history.state && history.state.view === "cards") history.back();
  else show("play");
}

window.addEventListener("popstate", () => {
  // Only the sheet is closable this way. Elsewhere back may leave the page,
  // as it should in a browser.
  if (view === "cards") show("play");
});
el("cards-save").onclick = saveAdvances;

el("cities-down").onclick = () => changeCities(-1);
el("cities-up").onclick = () => changeCities(1);
el("census").addEventListener("input", scheduleCensus);
el("census").addEventListener("blur", () => { if (me) el("census").value = me.census; });

el("code-go").onclick = submitCode;
el("code").addEventListener("keydown", (e) => {
  if (e.key === "Enter") submitCode();
});
el("seat-back").onclick = () => { show("join-code"); };
// A saved session goes straight to the game view, so locking the phone or
// closing the browser does not require joining again.
if (session.read()) { enterGame(); } else { show("join-code"); }
</script>
</body>
</html>
